# Chinese BabyLM 2026 final evaluation configuration.
#
# The NLU fine-tuning hyperparameters are identical to the config.yaml frozen
# in the Hugging Face model repository before the June 11 AoE deadline. Only
# the final pipeline's released hidden tasks are added here.

models:
  - path: chinese_cache/hf_models/zh-d22-step10000-layer08-selected
    backend: causal

tasks:
  zero_shot:
    - zhoblimp
    - xcomps_zh
    - hanzi_structure
    - hanzi_pinyin
    - hanzi_structure_hidden
    - hanzi_pinyin_hidden

  cogbench:
    - word_fmri
    - fmri

  finetune:
    - afqmc
    - ocnli
    - tnews
    - cluewsc2020
    - c3
    - diagnostic_nli

eval_dir: evaluation_data
results_dir: chinese_cache/final_eval_results

save_item_with_unk: true

finetune_hparams:
  lr: 3.0e-5
  batch_size: 32
  max_epochs: 10
  sequence_length: 128
  seed: 42

  task_overrides:
    afqmc:
      lr: 3.0e-5
      batch_size: 32
      max_epochs: 10
    ocnli:
      lr: 3.0e-5
      batch_size: 32
      max_epochs: 10
    tnews:
      lr: 3.0e-5
      batch_size: 32
      max_epochs: 10
    cluewsc2020:
      lr: 3.0e-5
      batch_size: 32
      max_epochs: 30
    c3:
      lr: 3.0e-5
      batch_size: 32
      max_epochs: 10
    diagnostic_nli:
      lr: 3.0e-5
      batch_size: 32
      max_epochs: 10
