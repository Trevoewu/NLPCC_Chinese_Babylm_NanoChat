  const y=v=>H-pad.b-((v-minY)/(maxY-minY))*(H-pad.t-pad.b);
  ctx.strokeStyle='#d8dee8'; ctx.lineWidth=1; ctx.font='12px system-ui'; ctx.fillStyle='#5b6575';
  for(let i=0;i<=10;i++){
    const yy=pad.t+i*(H-pad.t-pad.b)/10;
    ctx.beginPath(); ctx.moveTo(pad.l,yy); ctx.lineTo(W-pad.r,yy); ctx.stroke();
    const label=(maxY-i*(maxY-minY)/10).toFixed(1);
    ctx.fillText(label,12,yy+4);
  }
  for(let s=0;s<=5000;s+=500){
    const xx=x(s); ctx.beginPath(); ctx.moveTo(xx,pad.t); ctx.lineTo(xx,H-pad.b); ctx.stroke();
    ctx.fillText(String(s),xx-14,H-18);
  }
  ctx.strokeStyle='#172033'; ctx.beginPath(); ctx.moveTo(pad.l,pad.t); ctx.lineTo(pad.l,H-pad.b); ctx.lineTo(W-pad.r,H-pad.b); ctx.stroke();
  function line(data,key,color,width){
    ctx.strokeStyle=color; ctx.lineWidth=width; ctx.beginPath();
    data.forEach((d,i)=>{ const xx=x(d.step), yy=y(d[key]); if(i===0)ctx.moveTo(xx,yy); else ctx.lineTo(xx,yy); });
    ctx.stroke();
  }
  line(train,'loss','#2563eb',2);
  line(val,'bpb','#b45309',3);
  ctx.fillStyle='#b45309';
  val.forEach(d=>{ctx.beginPath();ctx.arc(x(d.step),y(d.bpb),3.8,0,Math.PI*2);ctx.fill();});
  const best=val.reduce((a,b)=>a.bpb<b.bpb?a:b);
  ctx.strokeStyle='#dc2626'; ctx.lineWidth=1.5; ctx.setLineDash([6,5]);
  ctx.beginPath(); ctx.moveTo(x(best.step),pad.t); ctx.lineTo(x(best.step),H-pad.b); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#dc2626'; ctx.font='13px system-ui'; ctx.fillText(`best val ${best.bpb.toFixed(6)} @ step ${best.step}`, x(best.step)+8, y(best.bpb)-10);
  ctx.fillStyle='#5b6575'; ctx.font='12px system-ui'; ctx.fillText('step', W-58, H-18); ctx.save(); ctx.translate(18,70); ctx.rotate(-Math.PI/2); ctx.fillText('loss / bpb',0,0); ctx.restore();
}
draw();
const tbody=document.querySelector('#valtable tbody');
val.forEach(d=>{const tr=document.createElement('tr'); tr.innerHTML=`<td>${d.step}</td><td>${d.bpb.toFixed(6)}</td>`; tbody.appendChild(tr);});
</script>
</body>
