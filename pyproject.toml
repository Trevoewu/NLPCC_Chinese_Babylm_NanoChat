[project]
name = "nanochat"
version = "0.1.0"
description = "the minimal full-stack ChatGPT clone"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.12.0",
    "datasets>=4.0.0",
    "fastapi>=0.117.1",
    "filelock>=3.20.0",
    "huggingface-hub>=0.34.0,<1.0",
    "jinja2>=3.1.0",
    "kernels>=0.11.7",
    "matplotlib>=3.10.8",
    "pandas>=2.3.0",
    "psutil>=7.1.0",
    "pyarrow>=22.0.0",
    "pyyaml>=6.0.0",
    "rustbpe>=0.1.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
    "tiktoken>=0.11.0",
    "tokenizers>=0.22.0",
    "torch==2.9.1",
    "transformers>=4.57.3,<5.0",
    "uvicorn>=0.36.0",
    "wandb>=0.21.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.1",
]


[tool.setuptools.packages.find]
include = ["nanochat*", "tasks*"]
exclude = ["data*", "runs*", "dev*", "docs*", "eval_configs*", "chinese_cache*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# target torch to cuda 12.8 or CPU
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
cpu = [
    "setuptools>=65.0.0",
    "torch==2.9.1",
]
gpu = [
    "torch==2.9.1",
]

[tool.uv]
default-groups = []
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]
